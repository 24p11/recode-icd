[project]
name = "recode-icd"
version = "0.1.0"
description = "Toolkit Python pour exploiter les référentiels CIM-10 (OFS, OWL/ANS) et enrichir des prompts LLM."
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Rémi Flicoteaux", email = "remi.flicoteaux@gmail.com" },
]
dependencies = [
    "polars>=1.40.1",
    "pyarrow>=24.0.0",
    "rdflib>=7.6.0",
    "pandera[polars]>=0.21.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "typer>=0.13",
    "loguru>=0.7",
    "smt2parquet",
    "fastexcel>=0.16",
]

[project.optional-dependencies]
# Dépendances pour les notebooks LLM exploratoires
# (génération de synonymes via Mistral, etc.).
# Installation : `uv sync --extra llm`.
llm = [
    "mistralai>=1.0",
    "pyyaml>=6.0",  # doublon volontaire avec la dep principale, pour expliciter l'usage llm
]

# Conversion et exécution des notebooks d'exploration
# (`scripts/explore/_convert_to_ipynb.py`). Le convertisseur était
# committé sans sa dépendance : il ne pouvait pas tourner.
# Installation : `uv sync --extra notebook`.
notebook = [
    "nbformat>=5.10",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
]

[project.scripts]
recode-icd = "recode_icd.cli:app"

[tool.uv.sources]
smt2parquet = { git = "https://github.com/dridk/smt2parquet" }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "types-pyyaml>=6.0",
    # Kernel pour l'exécution interactive des cellules `# %%` dans VSCode / Jupyter.
    # Voir scripts/explore/*.py.
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recode_icd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: tests unitaires rapides, sans I/O ni Parquet",
    "regression: golden-files sur codes témoins (tests/fixtures/sample_codes.yaml)",
    "integration: pipeline complet de bout en bout (lecture RDF/OFS, écriture Parquet)",
]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = [
    "*.ipynb",   # notebooks d'exploration : pas de lint sur le code généré
    "arXiv/",    # archive legacy v1 : figée, ne pas relinter ni reformater
]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # isort
    "N",             # pep8-naming
    "UP",            # pyupgrade
    "B",             # bugbear
    "SIM",           # simplify
    "RUF",           # ruff-specific
]
ignore = [
    "E501",          # line length géré par formatter
]
# Caractères Unicode légitimes du domaine médical FR : × (croisé
# source × type dans les rapports), æ (ligature nævus ANS), etc.
allowed-confusables = ["×", "æ", "’"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N803"]   # noms de tests souples
"scripts/explore/**" = ["RUF001"]   # typographie française intentionnelle (–, ×, etc.)
"src/recode_icd/_normalize.py" = ["RUF001", "RUF002", "RUF003"]   # caractères Unicode load-bearing dans le regex
"tests/unit/test_normalize.py" = ["RUF001", "RUF002"]   # en-dash U+2013 testés explicitement (limitation assumée)
"src/recode_icd/merge.py" = ["RUF003"]   # symbole ∪ intentionnel dans les commentaires

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src/recode_icd"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["rdflib.*", "smt2parquet.*", "pyarrow.*"]
ignore_missing_imports = true
