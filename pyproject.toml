[project]
name = "recode-icd"
version = "0.1.0"
description = "Toolkit Python pour exploiter les référentiels CIM-10 (OFS, OWL/ANS) et enrichir des prompts LLM."
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Rémi Flicoteaux", email = "remi.flicoteaux@gmail.com" },
]
dependencies = [
    "polars>=1.40.1",
    "pyarrow>=24.0.0",
    "rdflib>=7.6.0",
    "pandera[polars]>=0.21.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "typer>=0.13",
    "loguru>=0.7",
    "smt2parquet",
    "fastexcel>=0.16",
]

[project.scripts]
recode-icd = "recode_icd.cli:app"

[tool.uv.sources]
smt2parquet = { git = "https://github.com/dridk/smt2parquet" }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "types-pyyaml>=6.0",
    # Kernel pour l'exécution interactive des cellules `# %%` dans VSCode / Jupyter.
    # Voir scripts/explore/*.py.
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recode_icd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: tests unitaires rapides, sans I/O ni Parquet",
    "regression: golden-files sur codes témoins (tests/fixtures/sample_codes.yaml)",
    "integration: pipeline complet de bout en bout (lecture RDF/OFS, écriture Parquet)",
]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["*.ipynb"]   # notebooks d'exploration : pas de lint sur le code généré

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # isort
    "N",             # pep8-naming
    "UP",            # pyupgrade
    "B",             # bugbear
    "SIM",           # simplify
    "RUF",           # ruff-specific
]
ignore = [
    "E501",          # line length géré par formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N803"]   # noms de tests souples
"scripts/explore/**" = ["RUF001"]   # typographie française intentionnelle (–, ×, etc.)
"src/recode_icd/_normalize.py" = ["RUF001", "RUF002"]   # caractères Unicode load-bearing dans le regex
"src/recode_icd/merge.py" = ["RUF003"]   # symbole ∪ intentionnel dans les commentaires

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src/recode_icd"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["rdflib.*", "smt2parquet.*", "pyarrow.*"]
ignore_missing_imports = true
