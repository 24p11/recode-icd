# Suppressions autorisées lors de la curation des extraits du guide MCO.
#
# ─────────────────────────────────────────────────────────────────────
# CE FICHIER EST UNE DÉCLARATION, PAS UN FILTRE DE CONFORT.
#
#   Le test d'intégrité (`recode_icd.recommendations.transcription`)
#   exige que le flux de mots du curé égale celui du brut. Tout ce qui
#   est légitimement absent du curé doit être déclaré ICI, motif par
#   motif.
#
#   Ne JAMAIS élargir un motif pour « faire passer le test ». Un curé
#   qui a perdu un paragraphe doit échouer bruyamment : c'est
#   exactement ce que le test existe pour attraper. Si une suppression
#   nouvelle est justifiée, elle s'ajoute avec son motif et sa raison.
# ─────────────────────────────────────────────────────────────────────
#
# Les motifs s'appliquent LIGNE PAR LIGNE au brut, en correspondance
# totale (`fullmatch`). Une ligne qui matche est retirée avant
# comparaison.

commun:
  lignes_regex:
    # Ligne réduite à un nombre. Deux artefacts s'y confondent, et c'est
    # sans conséquence :
    #   - le numéro de page, que `pdftotext -layout` laisse au milieu du
    #     texte (le guide n'a pas d'en-tête courant) ;
    #   - le numéro d'appel de note, isolé sur sa ligne par le rendu.
    # Le second disparaît aussi du curé, où il devient un marqueur
    # `[^n]` que le test retire des deux côtés. Les deux sont donc
    # traités symétriquement.
    - '\s*\d{1,3}\s*'
    # Ligne vide ou blanche.
    - '\s*'

# Suppressions propres à un article, fusionnées avec le commun.
# Vide tant que le chantier B n'en a pas rencontré le besoin — et un
# besoin se démontre, il ne se suppose pas.
articles: {}
