# ---------------------------------------------------------------------
# 8. Scissions — jetons que le rendu a soudés
# ---------------------------------------------------------------------
# `pdftotext` soude parfois un mot, son exposant et le mot suivant en un
# seul jeton. Le curé les sépare pour se lire comme du français ; le
# contrôle vérifie que les fragments recomposés, appel retiré, redonnent
# EXACTEMENT le jeton du brut — une scission ne peut donc pas réécrire.
#
# Déclarées CAS PAR CAS, jamais automatiques. Généralisation seulement
# si le chantier B en produit des familles, sur décompte.
scissions:
  chapitre_xxi:
    "obligatoire33.On": ["obligatoire.", "On"]
    "antepartum29.": ["antepartum."]
