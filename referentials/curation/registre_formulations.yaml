# Registre des formulations écartées de la section « Formulations
# cliniques alternatives » pour registre archaïque (vocabulaire de
# certificat de décès, terminologie désuète — « apoplexie congestive »,
# « misère physiologique »…).
#
# ─────────────────────────────────────────────────────────────────────
# DOCTRINE — sonde ≠ verdict, granularité formulation, validation
# clinicienne.
#
#   La liste ci-dessous est le VERDICT LIGNE À LIGNE de RF sur le
#   support de relecture scripts/explore/relectures/
#   relecture_registre_formulations_v1.{csv,xlsx} (sondes lexicales +
#   signal d'isolement). Une formulation s'écarte ENTIÈRE, jamais ne se
#   réécrit. Le partage archaïque / vivant est clinicien, pas lexical :
#   la même sonde porte des écartées et des gardées (« maladie tabès »
#   s'écarte, « tabès syphilitique » se garde, sur le même code).
# ─────────────────────────────────────────────────────────────────────
#
# Filtre de RENDU, au même titre que R1/R3 (chapter_policy) : appliqué
# à l'assemblage des fiches, sur la FORME SOURCE EXACTE (code, source,
# texte). Le CSV maître, les Parquets et la colonne `texte` ne sont
# JAMAIS modifiés.
#
# Seules les familles de la section Formulations (INDEX, APHP, CEPIDC,
# LLM) peuvent y figurer — une entrée OFS ou ANS est refusée au
# chargement (`registre_formulations.load_registre`).

version: 1

validation:
  relecteur: RF
  date: 2026-09-09
  support: scripts/explore/relectures/relecture_registre_formulations_v1.xlsx

