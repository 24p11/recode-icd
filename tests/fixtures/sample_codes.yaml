# Codes témoins CIM-10 pour les tests de régression et les notebooks d'exploration.
#
# Sélection conforme à CLAUDE.md (Conventions de code) :
# - dague/astérisque, exclusions multiples, chap XX, chap XXI, C00-C75 avec .8.
#
# Pour chaque code :
#   - rationale : pourquoi il sert de témoin
#   - features  : phénomènes du pipeline qu'il illustre

codes:
  - code: A00.0
    libelle: "Choléra à Vibrio cholerae 01, biovar cholerae"
    rationale: "Catégorie historique, libellé divergent OFS↔OWL (réforme orthographique)"
    features:
      - leaf
      - merge_label_conflict

  - code: F02.00
    libelle: "Démence de la maladie de Pick"
    rationale: "Dague/astérisque OWL via triple direct hasCausality → G31.0"
    features:
      - dagger_asterisk_direct

  - code: F66.2
    libelle: "Trouble de la relation sexuelle"
    rationale: "Catégorie avec skos:definition OWL (rare, ~387 codes)"
    features:
      - owl_definition

  - code: I41.1
    libelle: "Myocardite au cours de grippe"
    rationale: "Dague/astérisque OWL via reification owl:Axiom → J11.8"
    features:
      - dagger_asterisk_axiom

  - code: J45.8
    libelle: "Autres asthmes"
    rationale: "Sous-catégorie .8 avec frères .0/.1 → synthèse d'exclusion"
    features:
      - dot8_sibling_synthesis

  - code: C50.8
    libelle: "Lésion à localisations contiguës du sein"
    rationale: "Sous-catégorie .8 dans C00-C75 — SKIP de la synthèse (lésion contiguë)"
    features:
      - dot8_sibling_skip_c00_c75

  - code: K70.3
    libelle: "Cirrhose alcoolique du foie"
    rationale: "Code chap XI avec exclusions OFS multiples (codes liés alcool)"
    features:
      - multiple_exclusions

  - code: V03.1
    libelle: "Piéton blessé dans une collision avec une voiture, accident de la circulation"
    rationale: "Chapitre XX (causes externes, V01-Y98) — structure 5-char standard"
    features:
      - chapter_xx

  - code: Z00.0
    libelle: "Examen médical général"
    rationale: "Chapitre XXI (facteurs influant sur l'état de santé) — non-maladie"
    features:
      - chapter_xxi

  - code: T81.0
    libelle: "Hémorragie et hématome compliquant un acte à visée diagnostique"
    rationale: "Chap XIX (lésions/empoisonnements) — exclusions héritées du bloc"
    features:
      - inherited_exclusions

  # ------------------------------------------------------------------
  # Codes témoins Phase 3 (sources externes) — cf
  # tests/regression/test_external_sources_witnesses.py et
  # tests/regression/README.md pour la liste des cas validés.
  # ------------------------------------------------------------------

  - code: E84.8
    libelle: "Mucoviscidose avec autres manifestations"
    rationale: "ORPHANET relation E sur libellé contenant 'mucoviscidose'. E84 (parent) est non-leaf → exclu du CSV, on teste sur la sous-catégorie."
    features:
      - external_orphanet_synonym

  - code: D59.5
    libelle: "Hémoglobinurie paroxystique nocturne"
    rationale: "Maladie rare, ORPHANET relation E avec plusieurs synonymes."
    features:
      - external_orphanet_synonym

  - code: Q87.8
    libelle: "Autres syndromes congénitaux malformatifs précisés, non classés ailleurs"
    rationale: "Cas extrême : code-fourre-tout dominé par les inclusions ORPHANET (>1000 entrées NTBT)."
    features:
      - external_orphanet_inclusion_dominant

  - code: E74.0
    libelle: "Thésaurismose glycogénique"
    rationale: "Inclusions ORPHANET NTBT (sous-classification des glycogénoses)."
    features:
      - external_orphanet_inclusion

  - code: A52.7
    libelle: "Autres formes tardives de syphilis symptomatique"
    rationale: "Cas extrême CIM-10 index : >2000 entrées (libellés historiques de la syphilis tardive)."
    features:
      - external_index_dominant

  - code: I10
    libelle: "Hypertension essentielle (primitive)"
    rationale: "Code standard avec entrées Index CIM-10 vol3 — sanity test."
    features:
      - external_index_synonym

  - code: H22.0
    libelle: "Affections inflammatoires de l'iris et du corps ciliaire au cours de maladies infectieuses et parasitaires classées ailleurs"
    rationale: "Code chap VII avec entrées AP-HP Ophtalmologie non absorbées (~25)."
    features:
      - external_aphp_ophtalmologie

  - code: N08.5
    libelle: "Glomérulopathies au cours d'autres affections systémiques"
    rationale: "Code chap XIV avec entrées AP-HP Néphrologie non absorbées (~15)."
    features:
      - external_aphp_nephrologie

  - code: U07.10
    libelle: "COVID-19, forme respiratoire, virus identifié"
    rationale: "Code post-2006 ANS-only (sub-leaf de U07.1). Ne doit pas avoir d'entrées externes (sources externes pré-COVID)."
    features:
      - post_2006_no_external

  - code: A90
    libelle: "(non présent dans CIM-10 ANS 2025)"
    rationale: "Code retiré par l'ATIH (refonte FR-PMSI). Doit être absent du CSV final et classé pre_2006_dropped_by_atih dans le rapport orphan."
    features:
      - orphan_pre_2006_dropped

  # A18.1 est testé pour la coexistence dague/astérisque + sources externes,
  # mais le code lui-même est documenté en tant que témoin canonique dans
  # docs/source_mapping.md §"Couples dague/astérisque" et CLAUDE.md.
  - code: A18.1
    libelle: "Tuberculose de l'appareil génito-urinaire"
    rationale: "Témoin dague/astérisque (subordinate vs N33.0) ET témoin de coexistence avec entrées externes (Index CIM-10 + AP-HP Néphro + ORPHANET)."
    features:
      - dagger_asterisk_subordinate
      - dagger_external_coexist

  # ------------------------------------------------------------------
  # Codes témoins Chantier A (propagation hiérarchique → source_level)
  # ------------------------------------------------------------------

  - code: E80.7
    libelle: "Anomalie du métabolisme de la bilirubine, sans précision"
    rationale: "Témoin des 4 niveaux de source_level : note propre (code), héritée de la catégorie E80, du bloc E70-E90, et du chapitre IV. Hors dague/astérisque."
    features:
      - propagation_all_levels

  # ------------------------------------------------------------------
  # Codes témoins refonte dague/astérisque (2026-05-30)
  # cf docs/sessions/2026-05-30_refonte_dagger_asterisk.md
  # ------------------------------------------------------------------

  - code: A01.0
    libelle: "Fièvre typhoïde"
    rationale: "Cas critique de la refonte : 3 paires DAGSTAR provoquaient une ×3 expansion (108 → 36 lignes après refonte). Fil rouge du diagnostic. is_dagger_in_pair=True, is_asterisk_in_pair=False."
    features:
      - dagger_in_pair
      - refonte_volumetry

  - code: G01
    libelle: "Méningite au cours d'affections bactériennes classées ailleurs"
    rationale: "Cas extrême de la refonte : 12 paires DAGSTAR côté astérisque provoquaient une ×12 expansion (192 → 16 lignes après refonte). is_dagger_in_pair=False, is_asterisk_in_pair=True."
    features:
      - asterisk_in_pair
      - refonte_volumetry

  - code: L62
    libelle: "Affections des ongles au cours de maladies classées ailleurs"
    rationale: "Code astérisque non pointé (daget=F, assoc=0) — code astérisque générique sans dague spécifique. is_dagger_in_pair=False, is_asterisk_in_pair=True (sémantique large des flags : on inclut les non pointés)."
    features:
      - asterisk_in_pair_unpointed
